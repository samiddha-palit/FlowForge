services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: "*"
      OIDC_JWKS_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/certs
      OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/token
      OIDC_USERINFO_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/userinfo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             gunicorn flowforge.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/realm-flowforge.json:/opt/keycloak/data/import/realm-flowforge.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/flowforge/.well-known/openid-configuration || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Mount the host kubeconfig so the worker can reach the Kind cluster
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: "*"
      OIDC_JWKS_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/certs
      OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/token
      OIDC_USERINFO_ENDPOINT: http://keycloak:8080/realms/flowforge/protocol/openid-connect/userinfo
    command: celery -A flowforge worker --beat --loglevel=info --concurrency=2

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
